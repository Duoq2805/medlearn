spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medlearn_db}
    username: ${SPRING_DATASOURCE_USERNAME:medlearn}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.medlearn: DEBUG
    org.hibernate.SQL: DEBUG