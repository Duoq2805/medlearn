spring:
  profiles:
    active: dev
  application:
    name: medlearn

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medlearn_db}
    username: ${SPRING_DATASOURCE_USERNAME:medlearn}
    password: ${SPRING_DATASOURCE_PASSWORD:default_db_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:default_test@example.com}
    password: ${SPRING_MAIL_PASSWORD:default_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:default_google_client_id}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:default_google_client_secret}
            scope:
              - email
              - profile

server:
  port: 8080

jwt:
  secret: "ThisIsADefaultSecretKeyForLocalDevOnly-256bits-CHANGE-ME"
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  password-reset-expiry-hours: ${JWT_PASSWORD_RESET_EXPIRY_HOURS:1}

app:
  url: http://localhost:8080

email:
  verification:
    expiry-hours: 24

auth:
  rate-limit:
    max-attempts: 5
    block-duration-minutes: 15
