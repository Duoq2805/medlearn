spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/medlearn_db
    username: medlearn
    password: Medlearn@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: 
  expiration: 86400000
  refresh-expiration: 604800000

app:
  url: http://localhost:8080

email:
  verification:
    expiry-hours: 24