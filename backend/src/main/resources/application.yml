spring:
  profiles:
    active: docker
  application:
    name: medlearn

  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medlearn_db}
    username: ${SPRING_DATASOURCE_USERNAME:medlearn}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Email
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 (Google, Facebook)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
#          facebook:
#            client-id: YOUR_FACEBOOK_APP_ID
#            client-secret: YOUR_FACEBOOK_APP_SECRET
#            scope:
#              - email
#              - public_profile

server:
  port: 8080

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  password-reset-expiry-hours: ${JWT_PASSWORD_RESET_EXPIRY_HOURS:1}

auth:
  rate-limit:
    max-attempts: 5
    block-duration-minutes: 15

# App
app:
  url: http://localhost:8080

email:
  verification:
    expiry-hours: 24