spring:
  profiles:
    active: docker
  application:
    name: medlearn

  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/medlearn_db}
    username: ${SPRING_DATASOURCE_USERNAME:medlearn}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Email
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # OAuth2 (Google, Facebook)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
#          facebook:
#            client-id: YOUR_FACEBOOK_APP_ID
#            client-secret: YOUR_FACEBOOK_APP_SECRET
#            scope:
#              - email
#              - public_profile

server:
  port: 6060

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# JWT
jwt:
  # Dev default only. Set JWT_SECRET in production (>= 32 chars).
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  password-reset-expiry-hours: ${JWT_PASSWORD_RESET_EXPIRY_HOURS:1}

auth:
  rate-limit:
    max-attempts: 5
    block-duration-minutes: 15

# AI
ai:
  gateway:
    default-provider: nine-router
    api-key: ${AI_GATEWAY_API_KEY:}
    base-url: ${AI_GATEWAY_BASE_URL:https://api.9router.com}
    timeout-ms: 60000
    max-retries: 2
  prompt:
    location: prompts
    encoding: UTF-8
    max-version-history: 20
  cache:
    enabled: true
    max-size: 1000
    ttl-minutes: 60
    max-entry-size: 10000
  quota:
    default-monthly-tokens: 1000000
    enabled: true
  rate-limit:
    enabled: true
    requests-per-minute: 100
    tokens-per-minute: 100000
  security:
    injection-filter-enabled: true
    output-filter-enabled: true
    max-prompt-length: 100000
    min-prompt-length: 1

# App
app:
  url: http://localhost:6060

email:
  verification:
    expiry-hours: 24