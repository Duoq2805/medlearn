spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  mail:
    username: "test@example.com"
    password: "test"
    host: localhost
    port: 25

  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            scope:
              - email
              - profile

server:
  port: 6060

jwt:
  secret: "ThisIsADefaultTestSecretKeyForLocalTestingOnly-256bits"
  expiration: 3600000 # 1 hour
  refresh-expiration: 604800000 # 7 days
  password-reset-expiry-hours: 1

app:
  url: http://localhost:6060

ai:
  gateway:
    default-provider: nine-router
    api-key: test-api-key
    base-url: http://localhost:9999
    timeout-ms: 5000
    max-retries: 1
  prompt:
    location: prompts
  cache:
    enabled: false
  quota:
    enabled: false
    default-monthly-tokens: 1000000
  rate-limit:
    enabled: false
    requests-per-minute: 100
    tokens-per-minute: 100000
  security:
    injection-filter-enabled: true
    output-filter-enabled: true
    max-prompt-length: 100000
    min-prompt-length: 1

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.tool.schema: DEBUG
    org.hibernate.SQL: DEBUG
    com.medlearn: DEBUG